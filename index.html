<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Last War — Что копить</title>
<style>
:root{--bg:#050b14;--panel:#0b192a;--line:#1d3c5b;--text:#f4f8ff;--muted:#8fa8c1;--blue:#49adff;--green:#38db82;--yellow:#ffca52}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#102342 0,#07111f 38%,#040a12 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:22px}h1{margin:0;font-size:32px}p{color:var(--muted);margin:7px 0 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,#0d1d31,#091522);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 15px 40px rgba(0,0,0,.22)}.head{display:flex;gap:12px;align-items:flex-start}.icon{font-size:32px}.name{font-size:20px;font-weight:900}.resource{font-size:13px;color:var(--muted);margin-top:4px}.numbers{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-top:20px}.label{font-size:11px;color:var(--muted);margin-bottom:5px}.value,.target{height:48px;border:1px solid #28557e;border-radius:12px;background:#06111d;color:var(--text);font-size:22px;font-weight:900;padding:8px 11px;width:100%}.target{display:flex;align-items:center;background:#10223a;color:#fff}.slash{font-size:28px;font-weight:900;color:#6d99c0;padding-bottom:8px}.bar{height:12px;background:#061321;border-radius:999px;overflow:hidden;margin-top:14px;border:1px solid #173650}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0}.bottom{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px;font-size:13px}.left{font-weight:800}.pct{color:var(--muted)}.advice{border-top:1px solid var(--line);margin-top:15px;padding-top:13px;color:#cfe2f5;font-size:13px;line-height:1.5}.why{color:var(--yellow);font-weight:800}.done{color:var(--green)!important}.source{font-size:10px;color:#6687a6;margin-top:9px}
@media(max-width:700px){.wrap{padding:14px}.grid{grid-template-columns:1fr}h1{font-size:27px}.card{padding:15px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Что копить в Last War</h1>
<p>Только события, подтверждённые твоим инвентарём. Текущие значения сохраняются автоматически.</p>
<div class="grid" id="grid"></div>
</div>
<script>
const KEY='lw_minimal_inventory_v2';
const data=[
 {id:'bounty',icon:'🔸',name:'Охотник за наградой',resource:'Наградной патрон',current:360,target:1800,advice:'Копи до 1 800 и делай большой заход вместо постоянного мелкого расхода. Этот порог часто используют игроки ради более выгодного набора накопительных наград.',source:'Community strategy: recent r/LastWarMobileGame Bounty Hunter discussions'},
 {id:'glitter',icon:'✨',name:'Сверкающий рынок',resource:'Блестящая монета',current:60,target:1000,advice:'Копи до 1 000. Это первый действительно сильный milestone: за суммарную трату 1 000 монет даётся сундук выбора компонента дрона 5 ур.; монеты можно переносить между запусками.',source:'Cpt Hedge — Glittering Market milestones'},
 {id:'bullseye',icon:'🎯',name:'Сокровища стрельбища',resource:'Боеприпасы',current:228,target:127,advice:'Рекомендуемый подход гайда — целиться в один раунд за событие. До Lv20 в среднем нужно 127 боеприпасов; полностью закрывать Lv20 для milestone не требуется.',source:'Cpt Hedge — Ammo Bonanza / Bullseye Loot Guide'},
 {id:'wonder',icon:'🎡',name:'Колесо Чудес / Рулетка Осколок героя',resource:'Чудо жетон',current:7,target:10,advice:'Копи минимум до 10: именно 10 жетонов открывают 10-spin. Но используй их только когда в ротации герой, которого ты реально качаешь.',source:'Last War Handbook — Hero Shard Roulette; Hot Deals rotation'}
];
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function fmt(n){return new Intl.NumberFormat('ru-RU').format(Number(n)||0)}
function save(){localStorage.setItem(KEY,JSON.stringify(saved))}
function render(){
 const grid=document.getElementById('grid');grid.innerHTML='';
 data.forEach(x=>{
   const cur=saved[x.id]??x.current; const left=Math.max(0,x.target-cur); const pct=x.target?Math.min(100,Math.max(0,cur/x.target*100)):0;
   const card=document.createElement('div');card.className='card';
   card.innerHTML=`<div class="head"><div class="icon">${x.icon}</div><div><div class="name">${x.name}</div><div class="resource">${x.resource}</div></div></div>
   <div class="numbers"><div><div class="label">У тебя</div><input class="value" inputmode="numeric" type="number" min="0" value="${cur}" data-id="${x.id}"></div><div class="slash">/</div><div><div class="label">Рекомендуемая цель</div><div class="target">${fmt(x.target)}</div></div></div>
   <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
   <div class="bottom"><div class="left ${left===0?'done':''}">${left===0?'✓ Цель достигнута':'Осталось: '+fmt(left)}</div><div class="pct">${Math.round(pct)}%</div></div>
   <div class="advice"><span class="why">Что делать:</span> ${x.advice}</div><div class="source">${x.source}</div>`;
   grid.appendChild(card);
 });
 grid.querySelectorAll('input[data-id]').forEach(inp=>inp.addEventListener('change',()=>{const v=Number(inp.value);if(Number.isFinite(v)&&v>=0){saved[inp.dataset.id]=v;save();render()}}));
}
render();
</script>
</body>
</html>
